apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: robot-shop-payment
  namespace: observability
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - robot-shop
  selector:
    matchLabels:
      monitoring: enabled
      service: payment
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
