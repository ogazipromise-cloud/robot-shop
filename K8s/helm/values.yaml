# Registry and repository for Docker images
# Default is docker/robotshop/image:latest
image:
  repo: robotshop
  version: latest
  pullPolicy: IfNotPresent

# Resource settings for the local Kubernetes environment.
resources:
  cart:
    limits:
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 50m
      memory: 50Mi

  catalogue:
    limits:
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 50m
      memory: 50Mi

  dispatch:
    limits:
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 50m
      memory: 50Mi

  mongodb:
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 50m
      memory: 100Mi

  mysql:
    limits:
      cpu: 200m
      memory: 1024Mi
    requests:
      cpu: 50m
      memory: 700Mi

  payment:
    limits:
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 50m
      memory: 50Mi

  rabbitmq:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

  ratings:
    limits:
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 50m
      memory: 50Mi

  redis:
    limits:
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 50m
      memory: 50Mi

  shipping:
    limits:
      cpu: 200m
      memory: 1000Mi
    requests:
      cpu: 50m
      memory: 500Mi

  user:
    limits:
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 50m
      memory: 50Mi

  web:
    limits:
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 50m
      memory: 50Mi

# Pod Security Policy
psp:
  enabled: false

# For the mini ones minikube, minishift set to true
nodeport: false

# "special" Openshift. Set to true when deploying to any openshift flavour
openshift: false

ocCreateRoute: false

######################################
# Affinities for individual workloads
# set in the following way:
# <workload>:
#   affinity: {}
#   nodeSelector: {}
#   tolerations: []
######################################

cart: {}

catalogue: {}

dispatch: {}

mongodb: {}

mysql: {}

payment:
  # Alternative payment gateway URL
  # Default is https://www.paypal.com
  gateway: null
  #gateway: https://www.worldpay.com

rabbitmq: {}

ratings: {}

redis:
  # Storage class to use with redis statefulset.
  storageClassName: standard

shipping: {}

user: {}

web: {}
